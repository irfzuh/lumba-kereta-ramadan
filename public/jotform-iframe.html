    function stopCelebration(){
      if(confettiRaf){ cancelAnimationFrame(confettiRaf); confettiRaf = 0; }

      const fl = $(&quot;lkr-victory-flash&quot;), cc = $(&quot;lkr-confetti&quot;);
      if(fl){ fl.className = &quot;lkr-victory-flash&quot;; fl.style.background = &quot;&quot;; }

    function startCelebration(diffKey){
      stopCelebration();
      const meta = TROPHY_META[diffKey] || TROPHY_META.medium;
      const fl = $(&quot;lkr-victory-flash&quot;), cc = $(&quot;lkr-confetti&quot;), app = $(&quot;lkr-app&quot;);
      if(fl){ fl.style.background = meta.flash; fl.className = &quot;lkr-victory-flash show&quot;; }
      if(!cc || !app) return;
      const cctx = cc.getContext(&quot;2d&quot;); if(!cctx) return;
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      const w = app.clientWidth || 640, h = app.clientHeight || 500;
      cc.width = Math.floor(w * dpr); cc.height = Math.floor(h * dpr);
      cctx.setTransform(dpr,0,0,dpr,0,0);
      cc.className = &quot;show&quot;;
      function burst(n, yRatio){
        for(let i=0;i<n;i++){
          const left = i % 2 === 0;
          const ox = left ? w * (0.15 + Math.random()*0.25) : w * (0.6 + Math.random()*0.25);
          const ang = -Math.PI/2 + (Math.random()-0.5)*1.15;
          const spd = 4.2 + Math.random()*7.5;
          confettiPieces.push({
            x:ox, y:h*yRatio, vx:Math.cos(ang)*spd, vy:Math.sin(ang)*spd-1.2,
            s:5+Math.random()*5, a:0.45+Math.random()*0.55, r:Math.random()*6.28, vr:(Math.random()-0.5)*0.22,
            c:meta.palette[i % meta.palette.length], al:1, sw:Math.random()*6.28
          });
        }
      }
      burst(75, 0.56);
      setTimeout(function(){ if(state.view===&quot;summary&quot;) burst(55, 0.34); }, 420);
      const t0 = performance.now();
      function stepConfetti(now){
        const el = now - t0;
        cctx.clearRect(0,0,w,h);
        for(let i=confettiPieces.length-1;i>=0;i--){
          const p = confettiPieces[i];
          p.sw += 0.08; p.vx *= 0.99; p.vy += 0.16; p.x += p.vx + Math.sin(p.sw)*0.65; p.y += p.vy; p.r += p.vr;
          if(el > 3000) p.al = Math.max(0, p.al - 0.022);
          if(p.al <= 0 || p.y > h + 24){ confettiPieces.splice(i,1); continue; }
          cctx.save(); cctx.globalAlpha = p.al; cctx.translate(p.x,p.y); cctx.rotate(p.r);
          cctx.fillStyle = p.c; cctx.fillRect(-p.s/2, -p.s*p.a/2, p.s, p.s*p.a); cctx.restore();
        }

          confettiRaf = requestAnimationFrame(stepConfetti);
        } else {
          cctx.clearRect(0,0,w,h);
          confettiRaf = 0;
        }
      }
      confettiRaf = requestAnimationFrame(stepConfetti);
    }

        ctx.fillStyle=&quot;#0EA5E9&quot;; ctx.beginPath(); ctx.moveTo(-43,10); ctx.lineTo(-44,-5); ctx.quadraticCurveTo(-30,-11,-17,-20); ctx.quadraticCurveTo(-2,-25,14,-18); ctx.quadraticCurveTo(30,-10,46,-2); ctx.lineTo(47,10); ctx.closePath(); ctx.fill();

    function loop(now){
      tick++;
      const dt = Math.min(0.05, (now-lastTs)/1000); lastTs = now;
      if(state.active){
        if(state.status!==&quot;normal&quot;){
          state.statusTimer -= dt;
          if(state.statusTimer<=0){ state.status=&quot;normal&quot;; state.speed=BASE_SPEED; }
        }
        state.playerDist += state.speed*SPEED_TO_MPS*dt;
        state.bgOffset += state.speed*dt*4.2;
        state.aiDist += DIFF_CFG[state.diff].ai*SPEED_TO_MPS*dt;
        state.timeRem = Math.max(0, state.timeRem-dt);
        updateAudio(now);

        $(&quot;hud-time&quot;).textContent = state.timeRem.toFixed(1)+&quot;s&quot;;
        $(&quot;hud-speed&quot;).textContent = Math.round(state.speed)+&quot; km/j&quot;;
        $(&quot;hud-dist&quot;).textContent = Math.round(state.playerDist)+&quot;m / &quot;+Math.round(state.aiDist)+&quot;m&quot;;
        updatePlayBadges();

        if(state.playerDist>=FINISH_DIST) finishRace(&quot;player&quot;);
        else if(state.aiDist>=FINISH_DIST) finishRace(&quot;ai&quot;);
        else if(state.timeRem<=0) finishRace(&quot;sunset&quot;);

          sky.addColorStop(0,sp>0.6?&quot;#0F172A&quot;:&quot;#1E293B&quot;); sky.addColorStop(1,sp>0.6?&quot;#9A3412&quot;:&quot;#F59E0B&quot;);

          ctx.fillStyle=&quot;rgba(255,255,255,&quot;+(0.12+sp*0.78)+&quot;)&quot;;

          ctx.fillStyle=sp>0.6?&quot;#0F172A&quot;:&quot;#1E293B&quot;; ctx.beginPath(); ctx.arc(mx+5,my-3,10,0,Math.PI*2); ctx.fill();

          const sunY=hy*0.32+(hy*0.78)*sp;
          ctx.fillStyle=&quot;#FDE047&quot;; ctx.beginPath(); ctx.arc(w*0.52,sunY,22,0,Math.PI*2); ctx.fill();

          const farX=(state.bgOffset*0.2)%240;
          ctx.fillStyle=&quot;#78350F&quot;; ctx.beginPath(); ctx.moveTo(0,hy+12);
          for(let x=-240;x<=w+240;x+=120) ctx.quadraticCurveTo(x-farX+60,hy-24,x-farX+120,hy+4);
          ctx.lineTo(w,h); ctx.lineTo(0,h); ctx.closePath(); ctx.fill();

          const mShift=(state.bgOffset*0.18)%560;
          ctx.fillStyle=&quot;#451A03&quot;;
          for(let mx2=-560;mx2<w+560;mx2+=560){
            const bx=mx2-mShift+220, by=hy-2;
            ctx.beginPath(); ctx.arc(bx,by-10,13,Math.PI,0); ctx.fill();
            ctx.fillRect(bx-16,by-10,32,12);
            ctx.fillRect(bx+18,by-26,5,28);
          }

          const roadTop=hy+10, roadH=h-roadTop;
          ctx.fillStyle=&quot;#1E293B&quot;; ctx.fillRect(0,roadTop,w,roadH);
          ctx.fillStyle=&quot;#F59E0B&quot;; ctx.fillRect(0,roadTop,w,2);
          const dash=state.bgOffset%64; ctx.fillStyle=&quot;rgba(248,250,252,0.5)&quot;;
          for(let dx=-64;dx<w+64;dx+=64) ctx.fillRect(dx-dash,roadTop+roadH*0.48,34,3);

          const lShift=state.bgOffset%200;
          for(let lx=-200;lx<w+200;lx+=200){
            const x=lx-lShift+50;
            ctx.fillStyle=&quot;#475569&quot;; ctx.fillRect(x,roadTop-16,2,16);
            ctx.fillStyle=&quot;#F59E0B&quot;; ctx.beginPath(); ctx.arc(x+1,roadTop-18,3.5,0,Math.PI*2); ctx.fill();
          }

          const px=Math.max(85,w*0.22), finX=px+(FINISH_DIST-state.playerDist)*5.8;
          if(finX>-40 &amp;&amp; finX<w+40){
            ctx.fillStyle=&quot;#F8FAFC&quot;; ctx.fillRect(finX,roadTop,10,roadH);
            ctx.fillStyle=&quot;#F59E0B&quot;; ctx.fillRect(finX-24,roadTop-18,58,16);
            ctx.fillStyle=&quot;#0F172A&quot;; ctx.font=&quot;700 9px sans-serif&quot;; ctx.textAlign=&quot;center&quot;; ctx.fillText(&quot;PENAMAT&quot;,finX+5,roadTop-7);
          }
          const aiY=roadTop+roadH*0.26, plY=roadTop+roadH*0.72, emitX=state.vehicle===&quot;car&quot;?px-52:px-24, emitY=plY+2, dustY=state.vehicle===&quot;car&quot;?plY+12:plY+17;
          const aiX=px+(state.aiDist-state.playerDist)*5.8;
          if(state.speed>=30){
            const hs=state.status===&quot;nitro&quot;||state.speed>=75;
            const dc=hs?3:(tick%2===0?1:0);
            for(let d=0;d<dc;d++) particles.push({k:&quot;dust&quot;,x:emitX+(Math.random()-0.5)*12,y:dustY+(Math.random()-0.5)*5,vx:-(state.speed*0.06)-Math.random()*2,vy:-0.3-Math.random()*1,r:hs?6+Math.random()*6:4+Math.random()*3.5,l:hs?24:18,m:hs?24:18});
            for(let g=0;g<(hs?3:1);g++) particles.push({k:&quot;grain&quot;,x:emitX+4,y:dustY+1,vx:-(state.speed*0.085)-Math.random()*4,vy:-1-Math.random()*1.8,r:1.3+Math.random()*1.2,l:15,m:15});
          }
          if(aiX>=-50 &amp;&amp; aiX<=w+50 &amp;&amp; DIFF_CFG[state.diff].ai>=45 &amp;&amp; tick%2===0){
            particles.push({k:&quot;dust&quot;,x:(state.vehicle===&quot;car&quot;?aiX-42:aiX-22),y:(state.vehicle===&quot;car&quot;?aiY+10:aiY+16),vx:-3.2,vy:-0.4,r:4.5+Math.random()*3,l:18,m:18});
          }
          const tint = state.vehicle===&quot;camel&quot;?&quot;amber&quot;:state.carId===&quot;car-gt&quot;?&quot;cyan&quot;:state.carId===&quot;car-drift&quot;?&quot;cobalt&quot;:state.carId===&quot;car-ferrari&quot;?&quot;crimson&quot;:&quot;amber&quot;;
          if(state.status===&quot;nitro&quot;){
            ctx.save(); ctx.globalCompositeOperation=&quot;lighter&quot;;
            const grad=ctx.createLinearGradient(emitX,emitY,emitX-85,emitY);
            if(tint===&quot;cyan&quot;){ grad.addColorStop(0,&quot;rgba(236,254,255,0.92)&quot;); grad.addColorStop(0.5,&quot;rgba(34,211,238,0.7)&quot;); grad.addColorStop(1,&quot;rgba(14,165,233,0)&quot;); }
            else if(tint===&quot;cobalt&quot;){ grad.addColorStop(0,&quot;rgba(254,249,195,0.92)&quot;); grad.addColorStop(0.5,&quot;rgba(56,189,248,0.72)&quot;); grad.addColorStop(1,&quot;rgba(29,78,216,0)&quot;); }
            else if(tint===&quot;crimson&quot;){ grad.addColorStop(0,&quot;rgba(254,240,138,0.94)&quot;); grad.addColorStop(0.5,&quot;rgba(239,68,68,0.76)&quot;); grad.addColorStop(1,&quot;rgba(185,28,28,0)&quot;); }
            else { grad.addColorStop(0,&quot;rgba(254,249,195,0.9)&quot;); grad.addColorStop(0.5,&quot;rgba(249,115,22,0.65)&quot;); grad.addColorStop(1,&quot;rgba(239,68,68,0)&quot;); }
            ctx.fillStyle=grad; ctx.beginPath(); ctx.moveTo(emitX,emitY-7); ctx.lineTo(emitX-85,emitY); ctx.lineTo(emitX,emitY+7); ctx.closePath(); ctx.fill();
            ctx.restore();
            for(let i=0;i<4;i++) particles.push({k:&quot;flame&quot;,t:tint,x:emitX,y:emitY+(Math.random()-0.5)*8,vx:-5-Math.random()*5,vy:(Math.random()-0.5)*1.8,r:4+Math.random()*5,l:16,m:16});
          }
          if(particles.length>220) particles.splice(0,particles.length-220);
          for(let i=particles.length-1;i>=0;i--){
            const p=particles[i]; p.x+=p.vx; p.y+=p.vy; p.l--;
            if(p.k===&quot;dust&quot;){ p.vx*=0.97; p.vy-=0.025; p.r+=0.28; }
            else if(p.k===&quot;grain&quot;){ p.vy+=0.12; }
            else { p.r*=0.95; }
            if(p.l<=0){ particles.splice(i,1); continue; }
            const t=p.l/p.m;
            if(p.k===&quot;dust&quot;){
              ctx.fillStyle=&quot;rgba(218,170,110,&quot;+(t*0.4)+&quot;)&quot;;
              ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fill();
            } else if(p.k===&quot;grain&quot;){
              ctx.fillStyle=&quot;rgba(253,224,155,&quot;+(t*0.85)+&quot;)&quot;;
              ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fill();
            } else {
              ctx.save(); ctx.globalCompositeOperation=&quot;lighter&quot;;
              if(p.t===&quot;cyan&quot;) ctx.fillStyle=t>0.5?&quot;rgba(236,254,255,&quot;+t+&quot;)&quot;:&quot;rgba(34,211,238,&quot;+t+&quot;)&quot;;
              else if(p.t===&quot;cobalt&quot;) ctx.fillStyle=t>0.5?&quot;rgba(254,249,195,&quot;+t+&quot;)&quot;:&quot;rgba(56,189,248,&quot;+t+&quot;)&quot;;
              else if(p.t===&quot;crimson&quot;) ctx.fillStyle=t>0.5?&quot;rgba(254,240,138,&quot;+t+&quot;)&quot;:&quot;rgba(220,38,38,&quot;+t+&quot;)&quot;;
              else ctx.fillStyle=t>0.5?&quot;rgba(253,224,71,&quot;+t+&quot;)&quot;:&quot;rgba(239,68,68,&quot;+t+&quot;)&quot;;
              ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fill(); ctx.restore();
            }
          }
          if(aiX>=-60 &amp;&amp; aiX<=w+60){
            if(state.vehicle===&quot;car&quot;) drawCar(aiX,aiY,false,DIFF_CFG[state.diff].ai,&quot;ai&quot;,sp);
            else drawCamel(aiX,aiY,false,DIFF_CFG[state.diff].ai);
          }
          if(state.vehicle===&quot;car&quot;) drawCar(px,plY,true,state.speed,state.carId,sp);
          else drawCamel(px,plY,true,state.speed);
          ctx.fillStyle=&quot;rgba(15,23,42,0.75)&quot;; ctx.fillRect(10,8,210,20);
          ctx.fillStyle=&quot;#FDE68A&quot;; ctx.font=&quot;600 10px monospace&quot;; ctx.textAlign=&quot;left&quot;;
          ctx.fillText(&quot;speed: &quot;+Math.round(state.speed)+&quot; km/j · bgX: &quot;+Math.round(state.bgOffset)+&quot;px&quot;,16,21);
        }
      }
      requestAnimationFrame(loop);
    }

    function startRace(){
      unlockAudio();
      stopAudio();
      const cfg=DIFF_CFG[state.diff];
      state.active=true; state.playerDist=0; state.aiDist=0; state.speed=BASE_SPEED; state.bgOffset=0;
      state.status=&quot;normal&quot;; state.statusTimer=0; state.timeRem=cfg.time; state.totalTime=cfg.time;
      state.correct=0; state.wrong=0; state.streak=0; state.bestStreak=0; state.topSpeed=BASE_SPEED;
      state.deck=[].concat(QUESTIONS).sort(function(){ return Math.random()-0.5; });
      state.qIdx=0;
      particles.length=0;
      showView(&quot;play&quot;);
      updatePlayBadges();
      renderQuestion();
      playSfx(&quot;start&quot;);
    }

    document.querySelectorAll(&quot;.lkr-diff-btn&quot;).forEach(function(btn){
      btn.addEventListener(&quot;click&quot;, function(){
        unlockAudio();
        playUi(&quot;select&quot;);
        state.diff=btn.getAttribute(&quot;data-diff&quot;);
        document.querySelectorAll(&quot;.lkr-diff-btn&quot;).forEach(function(b){ b.classList.toggle(&quot;active&quot;, b===btn); });
      });
    });
    document.querySelectorAll(&quot;.lkr-filter-btn&quot;).forEach(function(btn){
      btn.addEventListener(&quot;click&quot;, function(){
        unlockAudio();
        playUi(&quot;click&quot;);
        state.boardFilter = btn.getAttribute(&quot;data-filter&quot;) || &quot;all&quot;;
        document.querySelectorAll(&quot;.lkr-filter-btn&quot;).forEach(function(b){ b.classList.toggle(&quot;active&quot;, b===btn); });
        renderLeaderboard();
      });
    });

    $(&quot;brand-home&quot;).addEventListener(&quot;click&quot;, function(){ unlockAudio(); playUi(&quot;click&quot;); if(state.active){state.active=false;stopAudio();} showView(&quot;menu&quot;); });
    $(&quot;lkr-camel-btn&quot;).addEventListener(&quot;click&quot;, function(){ unlockAudio(); playUi(&quot;select&quot;); state.vehicle=&quot;camel&quot;; renderCarOptions(); });
    $(&quot;lkr-start-btn&quot;).addEventListener(&quot;click&quot;, startRace);
    $(&quot;sum-again-btn&quot;).addEventListener(&quot;click&quot;, startRace);
    $(&quot;sum-home-btn&quot;).addEventListener(&quot;click&quot;, function(){ unlockAudio(); playUi(&quot;click&quot;); showView(&quot;menu&quot;); });
    $(&quot;board-play-btn&quot;).addEventListener(&quot;click&quot;, startRace);
    $(&quot;notes-play-btn&quot;).addEventListener(&quot;click&quot;, startRace);
    $(&quot;board-reset-btn&quot;).addEventListener(&quot;click&quot;, function(){
      unlockAudio(); playUi(&quot;click&quot;);
      memoryBoard = [].concat(SEEDED_BOARD);
      try{ localStorage.setItem(STORE_KEY, JSON.stringify(memoryBoard)); }catch(e){}
      renderLeaderboard();
    });
    $(&quot;sum-board-btn&quot;).addEventListener(&quot;click&quot;, function(){ unlockAudio(); playUi(&quot;click&quot;); renderLeaderboard(); showView(&quot;board&quot;); });
    $(&quot;nav-arena&quot;).addEventListener(&quot;click&quot;, function(){ unlockAudio(); playUi(&quot;click&quot;); if(state.active){state.active=false;stopAudio();} showView(&quot;menu&quot;); });
    $(&quot;nav-board&quot;).addEventListener(&quot;click&quot;, function(){ unlockAudio(); playUi(&quot;click&quot;); if(state.active){state.active=false;stopAudio();} renderLeaderboard(); showView(&quot;board&quot;); });
    $(&quot;nav-notes&quot;).addEventListener(&quot;click&quot;, function(){ unlockAudio(); playUi(&quot;click&quot;); if(state.active){state.active=false;stopAudio();} showView(&quot;notes&quot;); });
    $(&quot;header-cta&quot;).addEventListener(&quot;click&quot;, function(){ unlockAudio(); if(state.view===&quot;play&quot;){playUi(&quot;click&quot;);state.active=false;stopAudio();showView(&quot;menu&quot;);} else startRace(); });
    $(&quot;btn-mute&quot;).addEventListener(&quot;click&quot;, function(){
      unlockAudio();
      state.muted=!state.muted;
      playUi(&quot;toggle&quot;, !state.muted);
      $(&quot;btn-mute&quot;).textContent = state.muted ? &quot;Bunyi: OFF&quot; : &quot;Bunyi: ON&quot;;
      $(&quot;btn-mute&quot;).classList.toggle(&quot;on&quot;, !state.muted);
    });
    $(&quot;btn-music&quot;).addEventListener(&quot;click&quot;, function(){
      unlockAudio();
      state.musicMuted=!state.musicMuted;
      playUi(&quot;toggle&quot;, !state.musicMuted);
      $(&quot;btn-music&quot;).textContent = state.musicMuted ? &quot;Muzik: OFF&quot; : &quot;Muzik: ON&quot;;
      $(&quot;btn-music&quot;).classList.toggle(&quot;on&quot;, !state.musicMuted);
    });
    window.addEventListener(&quot;pointerdown&quot;, unlockAudio, { passive:true });
    window.addEventListener(&quot;keydown&quot;, function(e){
      unlockAudio();
      if(state.view!==&quot;play&quot; || state.answered) return;
      const k=e.key.toUpperCase();
      if(k===&quot;1&quot;||k===&quot;A&quot;) handleAnswer(0);
      else if(k===&quot;2&quot;||k===&quot;B&quot;) handleAnswer(1);
      else if(k===&quot;3&quot;||k===&quot;C&quot;) handleAnswer(2);
      else if(k===&quot;4&quot;||k===&quot;D&quot;) handleAnswer(3);
    });

    renderCarOptions();
    renderLeaderboard();
    requestAnimationFrame(loop);
  }

  if(document.readyState === &quot;loading&quot;){
    document.addEventListener(&quot;DOMContentLoaded&quot;, startApp);
  } else {
    startApp();
  }
})();
